; TIPTOE firmware — one image for every unit. A unit runs as an outdoor "node" (default) or as the
; "handheld" you carry (set from the USB console: `role handheld`).
; Build:   pio run            Flash: pio run -t upload
; USB-C is data-only: the board must run from its battery or sit on the Qi pad while flashing.

[platformio]
default_envs = tiptoe

[env:tiptoe]
platform = platformio/espressif32@6.9.0      ; Arduino-ESP32 2.0.17 / IDF 4.4
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi      ; WROOM-1-N16R8: quad flash, octal PSRAM
board_build.partitions = partitions_node.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.2.0
build_src_filter = +<common/> +<tiptoe/>
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/common
